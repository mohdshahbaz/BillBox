# The website and licence server on Cloudflare Pages (billbox-app.pages.dev): built, checked and deployed on every push to
# main that touches website/ (other branches get a preview address). Needs the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; the licence and payment secrets are copied to Cloudflare when present.
name: Website

on:
  push:
    branches: ['**']
    paths: ['website/**', 'backend/src/services/license.js', 'backend/src/services/ed25519.js', '.github/workflows/website.yml']
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Build the pages
        run: python3 website/build.py
      - name: Licence server checks (checked by the app engine)
        run: node --disable-warning=ExperimentalWarning website/test/server.test.mjs
      - name: Deploy to Cloudflare Pages
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LICENSE_KEY_LIVE: ${{ secrets.LICENSE_KEY_LIVE }}
          LICENSE_KEY_TEST: ${{ secrets.LICENSE_KEY_TEST }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          UPI_VPA: ${{ secrets.UPI_VPA }}
          BANK_DETAILS: ${{ secrets.BANK_DETAILS }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set: the site was built and checked but not deployed."; exit 0
          fi
          set -o pipefail
          ./deploy.sh "${GITHUB_REF_NAME}" 2>&1 | tee deploy.log || {
            echo "::error title=Deploy log::$(grep -v '^\s*$' deploy.log | grep -v -i 'secret\b.*[A-Za-z0-9+/=]\{40,\}' | tail -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1; }
      - name: Check the live site
        if: github.ref == 'refs/heads/main'
        run: |
          sleep 25
          R=""
          for p in / /mac/ /windows/ /pricing/ /buy.html /sitemap.xml /videos/mac.mp4; do
            R="$R$(curl -s -o /dev/null -w '%{http_code}' "https://billbox-app.pages.dev$p") $p%0A"
          done
          for e in test live; do R="${R}api/$e/config: $(curl -s https://billbox-app.pages.dev/api/$e/config | head -c 400 | sed 's/%/%25/g')%0A"; done
          echo "::notice title=Live site::$R"
