# Builds BillBox for Android, the Mac and the iPhone and publishes them as a GitHub release.
#
#   git tag v15.2.0 && git push origin v15.2.0        → v15.2.0 (public) and v15.2.0-admin (admin), both published
#   or: Actions › Release › Run workflow › both / public / admin (the version can be left empty: next number)
#   a version ending in -admin (v15.2.0-admin) makes only the admin build
#
# Android is signed with your release key when these repository secrets exist (android/tools/make_keystore.sh makes them):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# The Mac app is signed for this Mac only (ad hoc) and the iPhone .ipa is unsigned: Sideloadly or AltStore sign it with
# your Apple ID while installing. See docs/CI_CD.md.
name: Release

on:
  push:
    tags: ['v*']
    # pushing a branch release/15.8.0 (or release/15.8.0-admin) also makes that release: for tools that cannot push tags
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which builds: both, public (website, live licences) or admin (your test build: test licences, Razorpay test mode)'
        type: choice
        options: [both, public, admin]
        default: both
      version:
        description: 'Version, e.g. 16.2.4 (leave empty: the next number after the newest release)'
        required: false
        default: ''
      prerelease:
        description: 'Mark a public build as a pre-release (admin builds always are)'
        type: boolean
        default: false
      clear_old:
        description: 'Delete the past builds (keeps the new one and the website''s public download). Off: every past build stays'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.v.outputs.code }}
      builds: ${{ steps.v.outputs.builds }}
      tags: ${{ steps.v.outputs.tags }}
    steps:
      - id: v
        env:
          INPUT: ${{ github.event.inputs.version }}
          PRE: ${{ github.event.inputs.prerelease }}
          EDITION_IN: ${{ github.event.inputs.edition }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            INPUT="${INPUT#v}"; INPUT="${INPUT%-admin}"
            if [ -z "$INPUT" ]; then
              # the next patch number after the newest release (public or admin)
              LAST="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | sed -E 's/^v//; s/-.*$//' \
                | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
              IFS=. read -r A B C <<<"${LAST:-0.0.0}"; INPUT="$A.$B.$(( ${C:-0} + 1 ))"
            fi
            [ "$EDITION_IN" = admin ] && INPUT="$INPUT-admin"
          fi
          RAW="${INPUT:-${GITHUB_REF_NAME}}"; RAW="${RAW#release/}"; V="${RAW#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Version '$RAW' must look like 15.2.0 (or 15.2.0-beta1)"; exit 1; }
          BASE="${V%%-*}"; IFS=. read -r MA MI PA <<<"$BASE"; PA="${PA:-0}"
          echo "code=$(( MA * 10000 + MI * 100 + PA ))" >> "$GITHUB_OUTPUT"
          # which builds: a plain version (15.2.0) → public 15.2.0 and admin 15.2.0-admin; 15.2.0-admin → admin only;
          # another suffix (15.2.0-beta1) → that public pre-release only; Run workflow can ask for one edition
          PUB=false; [[ "$V" == *-* || "$PRE" == "true" ]] && PUB=true
          if [[ "$V" == *-admin* ]]; then
            B='[{"edition":"admin","version":"'"$V"'","tag":"v'"$V"'","prerelease":true}]'
          elif [[ "$V" == *-* || "$EDITION_IN" == public ]]; then
            B='[{"edition":"public","version":"'"$V"'","tag":"v'"$V"'","prerelease":'"$PUB"'}]'
          else
            B='[{"edition":"public","version":"'"$V"'","tag":"v'"$V"'","prerelease":'"$PUB"'},{"edition":"admin","version":"'"$V"'-admin","tag":"v'"$V"'-admin","prerelease":true}]'
          fi
          echo "builds=$B" >> "$GITHUB_OUTPUT"
          echo "tags=$(jq -r 'map(.tag) | join(" ")' <<<"$B")" >> "$GITHUB_OUTPUT"
          echo "Releasing: $(jq -r 'map(.tag) | join(", ")' <<<"$B") (build $(( MA * 10000 + MI * 100 + PA )))"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    name: ${{ matrix.edition }} ${{ matrix.version }}
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ matrix.version }}
      code: ${{ needs.plan.outputs.code }}
      tag: ${{ matrix.tag }}
      edition: ${{ matrix.edition }}
      prerelease: ${{ matrix.prerelease }}
    secrets: inherit

  tidy:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Clear past builds (only when asked) and release branches
        # past builds stay on GitHub. Run workflow › "Delete the past builds" removes them all except the new builds and
        # the newest public (non pre-release) build, which the website's download buttons point at. Every
        # release/<version> branch (used to start a release when tags cannot be pushed) is removed once its release is out
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.plan.outputs.tags }}
          CLEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_old && 'yes' || 'no' }}
        run: |
          if [ "$CLEAR" = yes ]; then
            KEEP_PUBLIC="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --exclude-pre-releases --exclude-drafts --json tagName,isLatest,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[0].tagName // ""')"
            echo "keeping $TAGS and the website's public build ${KEEP_PUBLIC:-none}"
            gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | while read -r t; do
              [[ " $TAGS " == *" $t "* ]] && continue
              [ -n "$KEEP_PUBLIC" ] && [ "$t" = "$KEEP_PUBLIC" ] && continue
              gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag && echo "removed $t" || echo "::warning::could not remove $t"
            done
          else
            echo "past builds kept"
          fi
          git ls-remote --heads origin 'release/*' | awk '{print $2}' | sed 's#refs/heads/##' | while read -r b; do
            [ "$b" = "$GITHUB_REF_NAME" ] && continue
            git push origin --delete "$b" && echo "removed branch $b" || true
          done
          [[ "$GITHUB_REF_NAME" == release/* ]] && git push origin --delete "$GITHUB_REF_NAME" || true
          git push origin --delete selftest 2>/dev/null || true
