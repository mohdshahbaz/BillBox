# Linux and Windows apps (frontend/ Flutter desktop + the books engine). Built and smoke-tested on every push that
# touches them; the Release workflow calls this one to put the installers on the release.
name: Desktop (Linux, Windows)

on:
  push:
    branches: ['**']
    paths: ['frontend/**', 'backend/src/**', 'desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['frontend/**', 'backend/src/**', 'desktop/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      version: { type: string, required: true }

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.version || 'ci' }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04          # older glibc: the app runs on Ubuntu 22.04+, Debian 12+, Mint 21+ …
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb >/dev/null
      - name: Build
        run: |
          set -o pipefail
          desktop/build.sh linux "${{ inputs.version || '0.0.0-ci' }}" 2>&1 | tee build.log || {
            # the end of the log as an annotation, readable on the run's summary page
            echo "::error title=Build log (linux)::$( (grep -E ' error |error:|Error:' build.log | head -15; echo ...; grep -v '^\s*$' build.log | tail -25) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1; }
      - name: Smoke test (the app starts its engine and the books open)
        run: |
          mkdir -p /tmp/run && tar -C /tmp/run -xzf dist/BillBox-linux-*-x64.tar.gz
          export HOME=/tmp/home && mkdir -p $HOME
          (xvfb-run -a /tmp/run/BillBox/billbox > /tmp/app.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:37420/api/companies && break; sleep 1; done | head -c 300; echo
          curl -sf http://127.0.0.1:37420/api/companies >/dev/null || { cat /tmp/app.log; exit 1; }
          curl -sf http://127.0.0.1:37420/api/reports/dashboard | head -c 200; echo
          test -f "$HOME/.local/share/BillBox/data/registry.db" && echo "books in ~/.local/share/BillBox"
          pkill -f /tmp/run/BillBox/billbox || true; sleep 4
          if pgrep -f "BillBox/engine/node" >/dev/null; then echo "::error::engine still running after the app closed"; exit 1; fi
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: dist/*
          retention-days: 14

  windows:
    runs-on: windows-2022
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Inno Setup
        run: command -v iscc || [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress
      - name: Build
        run: |
          set -o pipefail
          desktop/build.sh windows "${{ inputs.version || '0.0.0-ci' }}" 2>&1 | tee build.log || {
            # the end of the log as an annotation, readable on the run's summary page
            echo "::error title=Build log (windows)::$( (grep -E ' error |error:|Error:' build.log | head -15; echo ...; grep -v '^\s*$' build.log | tail -25) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1; }
      - name: Smoke test (the app starts its engine and the books open)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\run | Out-Null
          Expand-Archive (Get-ChildItem dist\BillBox-windows-*-x64.zip).FullName C:\run -Force
          $p = Start-Process C:\run\BillBox.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-RestMethod http://127.0.0.1:37420/api/companies | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { Write-Error "engine did not answer"; exit 1 }
          Invoke-RestMethod http://127.0.0.1:37420/api/reports/dashboard | ConvertTo-Json -Depth 2 | Select-Object -First 5
          if (-not (Test-Path "$env:APPDATA\BillBox\data\registry.db")) { Write-Error "books not in %APPDATA%\BillBox"; exit 1 }
          Stop-Process $p -Force; Start-Sleep 5
          if (Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like 'C:\run\*' }) { Write-Error "engine still running after the app closed"; exit 1 }
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/*
          retention-days: 14
