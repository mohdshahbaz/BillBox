# Runs BillBox for iPhone in the iPhone Simulator on a GitHub Mac: the iPhone engine replays the parity working session
# (and is compared with the Mac's answers), the unit tests run on the simulator, then the app opens on those books and
# every screen is photographed, and the newest bills are drawn exactly as they print.
# Results go to the branch "selftest-results" (folder ios/), next to the Android ones.
# Start it from Actions › iPhone self-test › Run workflow (or it runs on pushes to the "selftest" branch).
name: iPhone self-test

on:
  workflow_dispatch:
  push:
    branches: [selftest]

permissions:
  contents: write

concurrency:
  group: ios-selftest
  cancel-in-progress: true

jobs:
  simulator:
    name: iPhone Simulator
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BID: com.local.billbox
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: The working session, on the Mac engine and the iPhone engine
        run: |
          W=$PWD/st; mkdir -p $W/out
          (cd backend && npm install --no-audit --no-fund)
          python3 ios/tests/parity/gen_scenario.py $W >/dev/null
          sed "s#{engine}#mac#g" $W/scenario.json > $W/scen-mac.json
          sed "s#{engine}#ios#g" $W/scenario.json > $W/scen-ios.json
          node --disable-warning=ExperimentalWarning ios/tests/parity/run-node.js $W/mac/data $W/scen-mac.json $W/mac/home/DistributorProBackups > $W/mac.jsonl
          (cd ios/BillBoxCore && swift build -c debug)
          BIN="$(cd ios/BillBoxCore && swift build --show-bin-path)/bbcheck"
          "$BIN" $W/ios/data $W/scen-ios.json $W/ios/home/DistributorProBackups > $W/ios.jsonl
          python3 ios/tests/parity/compare.py $W/scenario.json $W/mac.jsonl $W/ios.jsonl > $W/out/compare.txt 2>&1 || true
          tail -1 $W/out/compare.txt
          echo "::notice title=iPhone engine on macOS::$(tail -1 $W/out/compare.txt)"
          # the app opens on the main company
          sqlite3 $W/ios/data/registry.db "INSERT INTO app_settings(key,value) VALUES('last_company','1') ON CONFLICT(key) DO UPDATE SET value='1'"

      - name: Pick a simulator
        run: |
          xcodebuild -version | tee st/out/xcode.txt
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ios=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          ios.sort(key=lambda kx: (kx[0], 'Pro' not in kx[1]['name'], kx[1]['name']))
          k,x=ios[-1] if ios else (None,None)
          print(x['udid'] if x else '')
          ")
          [ -n "$UDID" ] || { echo "no iPhone simulator"; exit 1; }
          xcrun simctl list devices | grep "$UDID" | tee -a st/out/xcode.txt
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Unit tests on the simulator
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test -project ios/BillBox.xcodeproj -scheme BillBox -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee st/out/unit-tests.log | grep -E "Test Suite|Executed|error:|failed" | tail -30

      - name: Build the app for the simulator
        run: |
          set -o pipefail
          xcodebuild build -project ios/BillBox.xcodeproj -scheme BillBox -configuration Debug -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee st/out/build.log | grep -E "error:|warning: unre|BUILD" | tail -30
          APP=$(find build/Build/Products -maxdepth 2 -name BillBox.app -path "*iphonesimulator*" | head -1)
          echo "APP=$APP" >> $GITHUB_ENV

      - name: Open the app on the working session's books, photograph every screen, print the bills
        run: |
          O=$PWD/st/out; mkdir -p $O/shots
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" $BID; sleep 8; xcrun simctl terminate "$UDID" $BID || true
          C=$(xcrun simctl get_app_container "$UDID" $BID data)
          D="$C/Library/Application Support/DistributorPro"
          rm -rf "$D/data"; mkdir -p "$D"; cp -R st/ios/data "$D/data"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          n=0
          for p in dashboard billing bills purchases stock parties salesmen debitNotes reports settings; do
            n=$((n+1))
            xcrun simctl launch "$UDID" $BID -startPage $p > /dev/null
            sleep 7
            xcrun simctl io "$UDID" screenshot "$O/shots/$(printf %02d $n)_$p.png" >/dev/null 2>&1 || true
            xcrun simctl terminate "$UDID" $BID || true
          done
          # dark mode, one screen
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl launch "$UDID" $BID -startPage dashboard > /dev/null; sleep 7
          xcrun simctl io "$UDID" screenshot "$O/shots/99_dashboard_dark.png" >/dev/null 2>&1 || true
          xcrun simctl terminate "$UDID" $BID || true
          xcrun simctl ui "$UDID" appearance light || true
          # the bills, drawn as they print
          xcrun simctl launch "$UDID" $BID -BillBoxPrintTest 1 -startPage bills > /dev/null
          for i in $(seq 1 40); do [ -f "$C/Documents/selftest/done.txt" ] && break; sleep 2; done
          cp -R "$C/Documents/selftest/." $O/ 2>/dev/null || true
          for f in $O/bill_*.pdf; do [ -f "$f" ] && sips -s format png "$f" --out "${f%.pdf}.png" >/dev/null 2>&1 || true; done
          xcrun simctl terminate "$UDID" $BID || true
          cat $O/done.txt 2>/dev/null || echo "no bills were drawn"
          # anything the app reported as a crash
          xcrun simctl spawn "$UDID" log show --last 15m --style compact --predicate 'process == "BillBox"' 2>/dev/null | grep -iE "fault|crash|fatal" | head -40 > $O/app-log.txt || true
          ls -la $O/shots $O | head -60

      - name: Publish results to the selftest-results branch
        if: always()
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          R=$PWD/results; rm -rf $R
          git clone -q --depth 1 -b selftest-results "$URL" $R 2>/dev/null || { mkdir -p $R; git -C $R init -q -b selftest-results; git -C $R remote add origin "$URL"; }
          rm -rf $R/ios; mkdir -p $R/ios
          cp -R st/out/. $R/ios/ 2>/dev/null || true
          rm -f $R/ios/build.log
          grep -E "error:" st/out/build.log 2>/dev/null | head -40 > $R/ios/build-errors.txt || true
          echo "${{ github.sha }}" > $R/ios/commit.txt
          cd $R
          git config user.name "BillBox self-test"; git config user.email "actions@github.com"
          git add -A
          git commit -q -m "iPhone self-test for ${{ github.sha }}" || true
          for i in 1 2 3 4; do
            git push -q origin HEAD:selftest-results && break
            sleep $((i * 5)); git pull -q --rebase -X theirs origin selftest-results || true
          done
